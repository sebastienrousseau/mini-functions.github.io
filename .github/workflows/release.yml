name: Release

on: [push]

permissions:
  contents: read

jobs:
  # Builds the VuePress site and publishes docs/.vuepress/dist to the
  # gh-pages branch, as the retired jenkey2011/vuepress-deploy action
  # did: Node 24, Yarn 1, `yarn && yarn build`, then a single
  # force-pushed commit of the build output. Every push builds; only
  # main publishes, so a branch push cannot overwrite the live site.
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: |
          npm install --global yarn@1.22.22
          yarn
          yarn build

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        working-directory: docs/.vuepress/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=master
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit --quiet -m "Auto deploy from Github Actions"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            master:gh-pages

  # Deploys the gh-pages branch just published, with GitHub Actions
  # (see pages.yml).
  pages:
    name: Deploy Pages
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
